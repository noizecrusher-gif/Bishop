[package]
name = "bishop"
version = "0.10.0"
edition = "2024"
description = "A Linux terminal with a built-in AI assistant that sees what you see and types where you type"
homepage = "https://github.com/noizecrusher-gif/Bishop"
repository = "https://github.com/noizecrusher-gif/Bishop"
readme = "README.md"
license = "MIT"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_9"] }
async-channel = "2.5.0"
gtk = { version = "0.11", package = "gtk4", features = ["v4_22"] }
libc = "0.2.191"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
vte4 = { version = "0.10.0", features = ["v0_84"] }

[profile.release]
lto = true
strip = true

[package.metadata.deb]
name = "bishop"
maintainer = "noizecrusher-gif <noizecrushermusic@gmail.com>"
copyright = "2026, noizecrusher-gif"
section = "x11"
priority = "optional"
extended-description = """\
Bishop is a GTK terminal with a Claude Code assistant in a side panel. The assistant \
reads and types into your terminal session through Bishop, with approvals, a \
dangerous-command check, a password guard, an audit log, and an Emergency Stop."""
depends = "$auto"
recommends = "pkexec"
assets = [
    ["target/release/bishop", "usr/bin/", "755"],
    ["data/io.github.noizecrusher_gif.Bishop.desktop", "usr/share/applications/", "644"],
    ["data/icons/hicolor/16x16/apps/io.github.noizecrusher_gif.Bishop.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["data/icons/hicolor/24x24/apps/io.github.noizecrusher_gif.Bishop.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["data/icons/hicolor/32x32/apps/io.github.noizecrusher_gif.Bishop.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["data/icons/hicolor/48x48/apps/io.github.noizecrusher_gif.Bishop.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["data/icons/hicolor/64x64/apps/io.github.noizecrusher_gif.Bishop.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["data/icons/hicolor/128x128/apps/io.github.noizecrusher_gif.Bishop.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["data/icons/hicolor/256x256/apps/io.github.noizecrusher_gif.Bishop.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["data/icons/hicolor/512x512/apps/io.github.noizecrusher_gif.Bishop.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]
