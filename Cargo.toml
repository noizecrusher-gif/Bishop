[package]
name = "bishop"
version = "0.11.1"
edition = "2024"
# let-chains (`if let … && let …`) need 1.88.
rust-version = "1.88"
description = "A Linux terminal with a built-in AI assistant that sees what you see and types where you type"
homepage = "https://github.com/noizecrusher-gif/Bishop"
repository = "https://github.com/noizecrusher-gif/Bishop"
readme = "README.md"
license = "MIT"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
libc = "0.2.191"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
vte4 = { version = "0.10.0", features = ["v0_76"] }

[profile.release]
lto = true
strip = true

[package.metadata.deb]
name = "bishop"
maintainer = "noizecrusher-gif <noizecrushermusic@gmail.com>"
copyright = "2026, noizecrusher-gif"
section = "x11"
priority = "optional"
extended-description = """\
Bishop is a GTK terminal with a Claude Code assistant in a side panel. The assistant \
reads and types into your terminal session through Bishop, with approvals, a \
dangerous-command check, a password guard, an audit log, and an Emergency Stop."""
depends = "$auto"
recommends = "pkexec"
assets = [
    ["target/release/bishop", "usr/bin/", "755"],
    ["data/io.github.noizecrusher_gif.Bishop.desktop", "usr/share/applications/", "644"],
    ["data/io.github.noizecrusher_gif.Bishop.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/icons/hicolor/16x16/apps/io.github.noizecrusher_gif.Bishop.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["data/icons/hicolor/24x24/apps/io.github.noizecrusher_gif.Bishop.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["data/icons/hicolor/32x32/apps/io.github.noizecrusher_gif.Bishop.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["data/icons/hicolor/48x48/apps/io.github.noizecrusher_gif.Bishop.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["data/icons/hicolor/64x64/apps/io.github.noizecrusher_gif.Bishop.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["data/icons/hicolor/128x128/apps/io.github.noizecrusher_gif.Bishop.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["data/icons/hicolor/256x256/apps/io.github.noizecrusher_gif.Bishop.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["data/icons/hicolor/512x512/apps/io.github.noizecrusher_gif.Bishop.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]

# `cargo generate-rpm` (after `cargo build --release`): one package for Fedora and openSUSE. It
# depends on library sonames rather than package names, which differ between the two.
[package.metadata.generate-rpm]
summary = "Terminal with a built-in AI assistant"
release = "1"
auto-req = "no"
assets = [
    { source = "target/release/bishop", dest = "/usr/bin/bishop", mode = "755" },
    { source = "data/io.github.noizecrusher_gif.Bishop.desktop", dest = "/usr/share/applications/io.github.noizecrusher_gif.Bishop.desktop", mode = "644" },
    { source = "data/io.github.noizecrusher_gif.Bishop.metainfo.xml", dest = "/usr/share/metainfo/io.github.noizecrusher_gif.Bishop.metainfo.xml", mode = "644" },
    { source = "data/icons/hicolor/*/apps/io.github.noizecrusher_gif.Bishop.png", dest = "/usr/share/icons/hicolor/", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/bishop/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/bishop/README.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
"libgtk-4.so.1()(64bit)" = "*"
"libadwaita-1.so.0()(64bit)" = "*"
"libvte-2.91-gtk4.so.0()(64bit)" = "*"
"libc.so.6(GLIBC_2.34)(64bit)" = "*"

[package.metadata.generate-rpm.recommends]
polkit = "*"
